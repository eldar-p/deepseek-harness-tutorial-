agent-default-model:
  provider: lmstudio
  model: coder

llm-pi-ai:
  providers:
    lmstudio:
      displayName: LM Studio
      apiKeyEnv: LM_STUDIO_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:1234/v1
      defaultContextWindow: 98304
      defaultMaxTokens: 8192
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: coder
          contextWindow: 98304
          maxTokens: 8192

ui-theme:
  preference: dark

agent-presets:
  default: vm-only
