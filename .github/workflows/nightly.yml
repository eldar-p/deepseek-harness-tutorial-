name: nightly

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:coverage
        env:
          GIM_COVERAGE_MIN: '80'
          GIM_COVERAGE_FLOOR: '78'
      - run: npm run audit:prebeta
      - name: doctor readiness (field)
        run: node bin/gim.js doctor --readiness --stage=field
      - name: field-lite
        run: npm run field:lite
        env:
          GIM_NO_BANNER: '1'
