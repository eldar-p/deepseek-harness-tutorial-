name: Release check

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run infra:check
      - run: npm test
      - run: npm run audit -- --gate=pre-alpha
