name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage
        shell: bash
        env:
          GIM_COVERAGE_MIN: '80'
          GIM_COVERAGE_FLOOR: '78'

      - name: Audit gate (pre-alpha)
        run: node scripts/audit-run.mjs --gate=pre-alpha

      - name: Infrastructure check
        run: npm run infra:check

      - name: gim doctor
        run: node bin/gim.js doctor

      - name: gim help
        run: node bin/gim.js help

      - name: API smoke (mock)
        run: npm run smoke:api

      - name: Harness test pack
        run: npm run test:harness

  field-lite:
    name: field-lite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Field-lite (policy + llama CPU fetch)
        run: npm run field:lite
        env:
          GIM_NO_BANNER: '1'

  smoke-guest:
    name: smoke guest (ubuntu + docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guest build + mount smoke
        run: npm run smoke:guest
