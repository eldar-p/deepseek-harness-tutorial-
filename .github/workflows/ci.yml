name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test

      - name: Coverage gate
        run: npm run test:coverage
        shell: bash
        env:
          DEEP_COVERAGE_MIN: '80'
          DEEP_COVERAGE_FLOOR: '78'

      - name: Audit gate (pre-alpha)
        run: node scripts/audit-run.mjs --gate=pre-alpha

      - name: Infrastructure check
        run: npm run infra:check

      - name: deep doctor
        run: node bin/deep.js doctor

      - name: deep help
        run: node bin/deep.js help

  smoke-guest:
    name: smoke guest (ubuntu + docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guest build + mount smoke
        run: npm run smoke:guest
