# Deep profile overlay — guest-exec replaces host shell sandboxes.

- id: tool-pwsh
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: >-
      You are a coding agent on local llama.cpp (model id coder).
      Shell = tool bash only, runs inside the deep-guest container at /workspace.
      Host paths for Read/Write/Edit are under the Deep workspace only.
      Large repos: use `deep index search "query"` before bulk Read/Grep (see code-search skill).
      For precise navigation use lsp_query when language servers are installed (see lsp skill).
      No emoji. Prefer STRUCTURE.txt and .deep/memory.json. Stop after one short answer.

- id: sandbox-policy
  config:
    mode: danger-full-access

- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: danger-full-access

- id: compaction-basic
  config:
    thresholdRatio: 0.5
    retainRatio: 0.15
    maxTokens: 2048
    compactionRetries: 2
    auto: true

- id: tool-result-pruner
  config:
    thresholdChars: 4000
    headChars: 2000
    tailChars: 600

- id: fs-sandbox
  config:
    backend: 'file:///__PLUGIN_DIR__/workspace-jail-fs/index.mjs'

- insert:
  - id: one-shot-guard
    name: 'file:///__PLUGIN_DIR__/one-shot-guard/index.mjs'

  - id: harness-narrative
    name: 'file:///__PLUGIN_DIR__/harness-narrative/index.mjs'

  - id: bash-guest-local
    name: 'file:///__PLUGIN_DIR__/guest-bash-local/index.mjs'
    config:
      cwd: '/workspace'
      timeoutMs: 7200000
      maxTimeoutMs: 7200000
      maxOutputBytes: 48000
      maxSpillBytes: 16777216

  - id: code-search
    name: 'file:///__PLUGIN_DIR__/code-search/index.mjs'

  - id: lsp-bridge
    name: 'file:///__PLUGIN_DIR__/lsp-bridge/index.mjs'
